<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../Styles/Authenstyle.css">
    <link rel="stylesheet" href="../Styles/SignupStyle.css">
    <script src="../JS/Authentication.js"></script>
</head>
<body>
    <div class="signup-container">
        <form class="signup-form" method="post">
            <h2><c class="Unilorin">Sign Up</c> </h2>
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="matric-no">Matric No</label>
                <input type="text" id="matric-no" name="matric-no" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number" name="phone-number" class="line-input hidden" required>
            </div>
            <button type="submit">Sign Up</button>
            <div class="form-footer">
                <a href="login.html" class="btn-login">Already have an account? Login</a>
            </div>
        </form>
    </div>
</body>
</html>
