<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Of Ilorin Bus Transportation Portal Login</title>
    <link rel="stylesheet" href="../Styles/Authenstyle.css">
    <link rel="stylesheet" href="../Styles/styles.css">
    <script src="../JS/Authentication.js"></script>
</head>
<body>
    <div class="login-container">
        <form class="login-form">
            <h2><c class="unilorin">Login</c></h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="line-input hidden" required>
            </div>
            <div class="form-group">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Remember Me</label>
            </div>
            <button type="submit">Login</button>
            <div class="form-footer">
                <a href="#">Forgot Password?</a>
                <a href="../Pages/Signup Page.html">Sign Up</a>
            </div>
        </form>
    </div>
</body>
</html>
